# Checks every push and pull request: the shared engine's tests and builds, and the Mac app's build and self-test.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run build:core

  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross/package-lock.json
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && swift --version
      - run: cd cross && npm ci --no-audit --no-fund && npm run build:core
      - run: swift build -c release
      - run: swift run -c release MKPDFSelfTest
